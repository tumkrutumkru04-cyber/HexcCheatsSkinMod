<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HEX CHEATS · Admin Keys</title><style>
:root{color-scheme:dark;--bg:#070a10;--panel:#0e1522;--line:#223149;--text:#edf6ff;--muted:#8ea1b8;--cyan:#22d3ee;--green:#6ee7b7;--red:#fca5a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#12263c,#070a10 48%);color:var(--text);font:14px Inter,system-ui,sans-serif;min-height:100vh}.wrap{width:min(1100px,calc(100% - 32px));margin:0 auto;padding:42px 0 70px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}h1,h2{margin:0;font-weight:600;letter-spacing:-.03em}h1{font-size:27px}h2{font-size:18px;margin-bottom:17px}.eyebrow{color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.18em}.panel{border:1px solid var(--line);border-radius:18px;background:rgba(14,21,34,.86);padding:22px;box-shadow:0 20px 70px #0005;margin-bottom:18px}label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin:0 0 7px}input,button{font:inherit}input{width:100%;height:43px;border:1px solid var(--line);border-radius:9px;background:#080d16;color:var(--text);padding:0 12px;outline:none}input:focus{border-color:var(--cyan)}button{height:42px;border:1px solid rgba(34,211,238,.35);border-radius:9px;background:rgba(34,211,238,.1);color:var(--cyan);padding:0 16px;font-weight:800;cursor:pointer}button:hover{background:rgba(34,211,238,.18)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.actions{display:flex;gap:9px;align-items:end}.actions>div{flex:1}.message{min-height:21px;color:var(--muted);font-size:12px;margin-top:12px}.message.error{color:var(--red)}.message.ok{color:var(--green)}.key-output{padding:13px;border:1px solid rgba(110,231,183,.3);border-radius:10px;color:var(--green);font:800 15px ui-monospace,monospace;letter-spacing:.08em;margin-top:12px;word-break:break-all}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #1b2738;font-size:12px}th{color:var(--muted);font-size:10px;letter-spacing:.12em}td code{color:var(--cyan);font-weight:800}td button{height:30px;padding:0 9px;font-size:10px;color:var(--red);border-color:#7f1d1d;background:#450a0a}.login{width:min(420px,100%);margin:12vh auto}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.actions{display:grid;grid-template-columns:1fr}.wrap{padding-top:25px}}
</style></head><body><main class="wrap"><section id="login-panel" class="panel login"><p class="eyebrow">HEX CHEATS SKINMOD · ADMIN</p><h1>Key control</h1><p style="color:var(--muted);line-height:1.5">Sign in to generate, inspect, revoke, and create custom 24-hour access keys.</p><form id="login-form"><label>Username</label><input id="username" autocomplete="username" value="admin"><label style="margin-top:13px">Password</label><input id="password" type="password" autocomplete="current-password"><button style="width:100%;margin-top:16px">ADMIN LOGIN</button></form><p id="login-message" class="message"></p></section><section id="dashboard" class="hidden"><header><div><p class="eyebrow">HEX CHEATS SKINMOD · ADMIN</p><h1>Key control center</h1></div><button id="logout">LOG OUT</button></header><section class="panel"><h2>Create access key</h2><form id="key-form"><div class="grid"><div><label>Custom key (optional)</label><input id="key-code" placeholder="HEX-CHATS-XXXXXXXX"></div><div><label>Hours</label><input id="key-hours" type="number" value="24" min="1" max="720"></div><div><label>Max unique IPs</label><input id="key-ips" type="number" value="10" min="1" max="100"></div><div><label>Note</label><input id="key-note" placeholder="VIPLINK task"></div></div><div class="actions" style="margin-top:14px"><div></div><button type="submit">CREATE KEY</button><button id="random-key" type="button">GENERATE RANDOM</button></div></form><p id="key-message" class="message"></p><div id="key-output" class="key-output hidden"></div></section><section class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Key database</h2><button id="refresh">REFRESH</button></div><div class="table-wrap"><table><thead><tr><th>KEY</th><th>STATUS</th><th>EXPIRES</th><th>IP USAGE</th><th>NOTE</th><th></th></tr></thead><tbody id="keys"></tbody></table></div><p id="table-message" class="message"></p></section></section></main><script>
const $=id=>document.getElementById(id), api=async(path,options={})=>{const token=sessionStorage.getItem('hex_admin_token');options.headers={...(options.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(path,options);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d};
function showDashboard(){ $('login-panel').classList.add('hidden');$('dashboard').classList.remove('hidden');loadKeys() }
$('login-form').addEventListener('submit',async e=>{e.preventDefault();$('login-message').textContent='Checking…';try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('username').value,password:$('password').value})});sessionStorage.setItem('hex_admin_token',d.token);showDashboard()}catch(err){$('login-message').className='message error';$('login-message').textContent=err.message}});
$('logout').onclick=()=>{sessionStorage.removeItem('hex_admin_token');location.reload()};$('random-key').onclick=()=>{$('key-code').value='HEX-CHATS-'+crypto.randomUUID().replaceAll('-','').slice(0,8).toUpperCase()};
$('key-form').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/admin/keys',{method:'POST',body:JSON.stringify({code:$('key-code').value,hours:$('key-hours').value,maxIps:$('key-ips').value,note:$('key-note').value})});$('key-output').textContent=d.key.code;$('key-output').classList.remove('hidden');$('key-message').className='message ok';$('key-message').textContent='Key created. Share it only with the intended user.';e.target.reset();$('key-hours').value=24;$('key-ips').value=10;loadKeys()}catch(err){$('key-message').className='message error';$('key-message').textContent=err.message}});
async function loadKeys(){try{const d=await api('/api/admin/keys');$('keys').innerHTML=d.keys.map(k=>`<tr><td><code>${k.code}</code></td><td style="color:${k.valid?'#6ee7b7':'#fca5a5'}">${k.revoked?'REVOKED':k.valid?'ACTIVE':'EXPIRED'}</td><td>${new Date(k.expires_at*1000).toLocaleString()}</td><td>${k.used_ips} / ${k.max_ips}</td><td>${k.note||''}</td><td>${k.valid?`<button onclick="revokeKey('${k.code}')">REVOKE</button>`:''}</td></tr>`).join('')}catch(err){$('table-message').className='message error';$('table-message').textContent=err.message}}window.revokeKey=async code=>{if(!confirm('Revoke '+code+'?'))return;await api('/api/admin/keys/'+encodeURIComponent(code),{method:'DELETE'});loadKeys()};$('refresh').onclick=loadKeys;
if(sessionStorage.getItem('hex_admin_token'))showDashboard();
</script></body></html>
